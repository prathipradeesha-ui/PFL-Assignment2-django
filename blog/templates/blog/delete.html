{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Post - ProjectHub</title>

    <link
        rel="stylesheet"
        href="{% static 'blog/style.css' %}"
    >

</head>

<body>

    <nav class="navbar">

        <div class="navbar-inner">

            <a
                class="brand"
                href="{% url 'home' %}"
            >
                <span class="brand-icon">🚀</span>
                <span>ProjectHub</span>
            </a>

        </div>

    </nav>


    <main class="form-container">

        <div class="form-card">

            <h2>Delete Post</h2>

            <p class="form-description">
                Are you sure you want to delete this post?
            </p>


            <div class="delete-preview">

                <strong>
                    {{ post.title }}
                </strong>

                <p>
                    By {{ post.author }}
                </p>

            </div>


            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="delete-button"
                >
                    Yes, Delete Post
                </button>

            </form>


            <a
                class="back-link"
                href="{% url 'post_detail' post.id %}"
            >
                Cancel
            </a>

        </div>

    </main>

</body>

</html>
